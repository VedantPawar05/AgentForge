global:
  environment: production
  domain: agentforge.dev

api:
  replicaCount: 3
  image:
    repository: ghcr.io/agentforge/api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 4000
  resources:
    limits:
      cpu: 1000m
      memory: 2048Mi
    requests:
      cpu: 250m
      memory: 512Mi
  env:
    PORT: "4000"
    NODE_ENV: "production"
    LOG_LEVEL: "info"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

worker:
  replicaCount: 5
  image:
    repository: ghcr.io/agentforge/worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 2000m
      memory: 4096Mi
    requests:
      cpu: 500m
      memory: 1024Mi
  env:
    NODE_ENV: "production"
    LOG_LEVEL: "info"
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 25
    targetCPUUtilizationPercentage: 80

web:
  replicaCount: 2
  image:
    repository: ghcr.io/agentforge/web
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: app.agentforge.dev
      paths:
        - path: /
          pathType: Prefix
          service: web
    - host: api.agentforge.dev
      paths:
        - path: /
          pathType: Prefix
          service: api
  tls:
    - secretName: agentforge-tls
      hosts:
        - app.agentforge.dev
        - api.agentforge.dev

migration:
  enabled: true
  image:
    repository: ghcr.io/agentforge/api
    tag: "1.0.0"
