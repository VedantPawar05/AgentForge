<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AgentForge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: floating pill dock on top, sticky workspace card left, bento tiles + hairline list rows right. */
:root{--bg:#0a0a0b;--s1:#121213;--s2:#1a1a1c;--s3:#242428;--line:#2b2b2f;--fg:#f4f2ef;--mut:#8e8e95;--acc:#ff3b2f;--acc-ink:#fff;--wt:#f4f2ef;--wt-ink:#0a0a0b;--ok:#3ddc97;--warn:#ffb020;--bad:#ff6a5e;--info:#8ea2ff;--tbg:#070708;--tfg:#c9c9cf;--shadow:0 20px 60px rgba(0,0,0,.5);--f-d:'Archivo','Arial Narrow',Helvetica,Arial,sans-serif;--f-m:'JetBrains Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9e9e7;--s1:#fff;--s2:#f3f3f1;--s3:#e4e4e1;--line:#d3d3cf;--fg:#0c0c0d;--mut:#62626a;--acc:#e5261b;--wt:#0c0c0d;--wt-ink:#f4f2ef;--ok:#0f9d63;--warn:#b86e00;--bad:#d4231a;--info:#3a53d8;--shadow:0 20px 50px rgba(0,0,0,.12);color-scheme:light}}
:root[data-theme="light"]{--bg:#e9e9e7;--s1:#fff;--s2:#f3f3f1;--s3:#e4e4e1;--line:#d3d3cf;--fg:#0c0c0d;--mut:#62626a;--acc:#e5261b;--wt:#0c0c0d;--wt-ink:#f4f2ef;--ok:#0f9d63;--warn:#b86e00;--bad:#d4231a;--info:#3a53d8;--shadow:0 20px 50px rgba(0,0,0,.12);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--f-d);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
::selection{background:var(--acc);color:#fff}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ico{width:18px;height:18px;flex:none}
.label{font:500 11px/1.2 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.mono{font-family:var(--f-m)}.mut{color:var(--mut)}.sm{font-size:13px}
.h-xl{font-weight:900;font-stretch:80%;text-transform:uppercase;letter-spacing:-.035em;line-height:.84;font-size:clamp(52px,9vw,140px);margin:0;text-wrap:balance}
.h-lg{font-weight:900;font-stretch:82%;text-transform:uppercase;letter-spacing:-.03em;line-height:.9;font-size:clamp(34px,5vw,72px);margin:0;text-wrap:balance}
.h-md{font-weight:800;font-stretch:85%;text-transform:uppercase;letter-spacing:-.02em;line-height:1;font-size:26px;margin:0}
.big{font-weight:900;font-stretch:78%;line-height:.8;letter-spacing:-.04em;font-size:clamp(96px,13vw,190px);font-variant-numeric:tabular-nums}
.num{font-weight:800;font-stretch:82%;font-size:clamp(48px,5vw,72px);line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* dock */
.dock{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;padding:6px;background:color-mix(in srgb,var(--s1) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);max-width:calc(100vw - 24px)}
.dk-scroll{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.dk-scroll::-webkit-scrollbar{display:none}
.dk-r{display:flex;gap:2px;align-items:center;padding-left:6px;border-left:1px solid var(--line)}
.dk{display:inline-flex;align-items:center;gap:8px;height:40px;min-width:40px;padding:0 11px;border-radius:999px;border:0;background:none;cursor:pointer;color:var(--mut);position:relative;flex:none;transition:background .2s,color .2s}
.dk span{display:none;font:600 13px var(--f-d)}
.dk:hover{color:var(--fg);background:var(--s3)}
.dk.on{background:var(--wt);color:var(--wt-ink);padding:0 16px 0 13px}.dk.on span{display:inline}
.dk.brand{font:900 14px var(--f-d);color:var(--acc-ink);background:var(--acc);padding:0;justify-content:center;letter-spacing:-.04em}
.dk.acc{background:var(--acc);color:var(--acc-ink)}
.badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:9px;background:var(--acc);color:#fff;font:700 10px/16px var(--f-m);text-align:center;font-style:normal}
/* shell */
.shell{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;padding-top:calc(env(safe-area-inset-top,0px) + 92px);padding-bottom:90px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);align-self:start;max-height:calc(100vh - 110px);overflow:auto;scrollbar-width:thin;border:1px solid var(--line);border-radius:30px;background:var(--s1)}
.pc-top{background:var(--acc);color:var(--acc-ink);padding:22px;display:grid;gap:30px}
.mg{font:900 64px/.8 var(--f-d);font-stretch:78%;letter-spacing:-.05em}
.pc-top .label{color:inherit;opacity:.75}
.pc-top h2{margin:0;font:800 22px/1 var(--f-d);font-stretch:85%;text-transform:uppercase}
.pc-body{padding:18px 20px;display:grid;gap:14px}
.sel{display:flex;justify-content:space-between;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--s2);font-size:14px}
.stat{display:flex;gap:14px}.stat div{flex:1}.stat b{display:block;font:800 30px/1 var(--f-d);font-stretch:85%}
.idx{padding:4px 10px 12px;border-top:1px solid var(--line)}
.idx a{display:flex;gap:12px;align-items:baseline;padding:8px 10px;border-radius:12px;font-size:14px;color:var(--mut);transition:padding .2s,color .2s,background .2s}
.idx a i{font:500 10px var(--f-m);font-style:normal;color:var(--mut);opacity:.7}
.idx a:hover{color:var(--fg);padding-left:16px}.idx a.on{color:var(--fg);background:var(--s2)}
.pc-foot{display:flex;gap:12px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;background:var(--wt);color:var(--wt-ink);display:grid;place-items:center;font:700 12px var(--f-m)}
main{min-width:0}
/* page */
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:20px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.ph-r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{display:flex;align-items:center;gap:16px;margin:56px 0 18px}.sec:first-child{margin-top:0}.sec .rule{flex:1;height:1px;background:var(--line)}
.g{display:grid;gap:14px}.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.sp2{grid-column:span 2}.sp3{grid-column:span 3}.sp4{grid-column:span 4}.sp5{grid-column:span 5}.sp6{grid-column:span 6}.sp7{grid-column:span 7}.sp8{grid-column:span 8}.sp12{grid-column:span 12}.rs2{grid-row:span 2}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:28px;padding:22px;position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.tile.red{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.tile.white{background:var(--wt);color:var(--wt-ink);border-color:transparent}
.tile.red .label,.tile.white .label{color:inherit;opacity:.7}
.tile .tl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tile .go{width:34px;height:34px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;opacity:.8}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px}.bars i{flex:1;background:currentColor;border-radius:6px;opacity:.9}
/* rows */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:var(--cols,1fr);gap:16px;align-items:center;padding:16px 6px;border-bottom:1px solid var(--line);transition:padding .2s,background .2s}
.row:hover{background:var(--s1);padding-left:16px}
.row.head{padding-top:10px;padding-bottom:10px}.row.head:hover{background:none;padding-left:6px}
.row b{font-weight:600}.row .st{display:flex;flex-direction:column;min-width:0}
.row .tm{font:400 12px var(--f-m);color:var(--mut)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font:500 11px var(--f-m);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;width:max-content}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.c-run{color:var(--ok)}.c-run i{animation:pulse 1.6s infinite}.c-test,.c-in{color:var(--warn)}.c-rev{color:var(--info)}.c-bad{color:var(--bad)}.c-ok{color:var(--fg)}.c-x{color:var(--mut)}
.p-urgent{color:var(--bad);border-color:currentColor}.p-high{color:var(--warn)}.p-medium,.p-low{color:var(--mut)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.c-run i{animation:none}}
.bar{height:6px;border-radius:9px;background:var(--s3);overflow:hidden;min-width:60px}.bar b{display:block;height:100%;background:var(--fg);border-radius:9px}
.tile.red .bar{background:rgba(255,255,255,.3)}.tile.red .bar b{background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--s2);font:600 13px var(--f-d);cursor:pointer;white-space:nowrap;transition:border-color .2s}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--acc);border-color:transparent;color:var(--acc-ink)}.btn.wt{background:var(--wt);color:var(--wt-ink);border-color:transparent}
.btn.sm{height:30px;padding:0 12px;font-size:12px}.btn.ic{width:34px;padding:0;height:34px}
.btn.dng{color:var(--bad)}
.in{height:40px;border-radius:14px;border:1px solid var(--line);background:var(--s2);color:var(--fg);padding:0 14px;font:inherit;width:100%;min-width:0}
textarea.in{height:auto;padding:12px 14px;min-height:96px;resize:vertical}
.fld{display:grid;gap:8px;min-width:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.form .full{grid-column:1/-1}
.sw{display:inline-block;width:40px;height:23px;border-radius:12px;background:var(--s3);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--fg)}
.sw.on{background:var(--acc)}.sw.on::after{left:20px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg span{padding:5px 14px;border-radius:999px;font:500 12px var(--f-m);color:var(--mut)}.seg span.on{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs span{padding:10px 0;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent}.tabs span.on{color:var(--fg);border-color:var(--acc)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.tog b{display:block;font-weight:600}
.term{background:var(--tbg);color:var(--tfg);border:1px solid var(--line);border-radius:22px;padding:18px;font:12.5px/1.75 var(--f-m);overflow-x:auto}
.term div{white-space:pre}.term .t{color:#6b6b73}.term .ok{color:#3ddc97}.term .wn{color:#ffb020}.term .er{color:#ff6a5e}
.diff{font:12px/1.65 var(--f-m);border:1px solid var(--line);border-radius:18px;overflow-x:auto;background:var(--s1)}
.diff div{display:grid;grid-template-columns:42px 42px 1fr;white-space:pre;min-width:520px}.diff div span:nth-child(-n+2){color:var(--mut);text-align:right;padding-right:10px;opacity:.7}
.diff .a{background:color-mix(in srgb,var(--ok) 14%,transparent)}.diff .d{background:color-mix(in srgb,var(--bad) 14%,transparent)}.diff .h{color:var(--info);background:var(--s2)}
.kboard{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 280px;background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:14px;display:grid;gap:10px}
.kcol>.kh{display:flex;justify-content:space-between;align-items:center;padding:4px 6px}
.kcard{background:var(--s2);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;font-size:14px}
.kcard.red{background:var(--acc);color:#fff;border-color:transparent}
.flow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.stage{flex:1 1 200px;border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px;background:var(--s1)}
.pill-in{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--s2)}
.desk{border:1px solid var(--line);border-radius:30px;min-height:420px;padding:20px;background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 55%),var(--s1);display:flex;justify-content:center;align-items:flex-start}
.isl{background:#000;color:#fff;border-radius:34px;padding:10px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);font-size:13px}
.isl.open{flex-direction:column;align-items:stretch;border-radius:30px;width:min(420px,100%);padding:18px;gap:14px}
.isl .row{border-color:#2a2a2e;padding:10px 0}.isl .row:hover{background:none;padding-left:0}
.isl .bar{background:#2a2a2e}.isl .bar b{background:#fff}
.skel{background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:200% 100%;animation:sk 1.6s infinite;border-radius:12px;height:14px}
@keyframes sk{to{background-position:-200% 0}}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;padding-block:calc(env(safe-area-inset-top,0px) + 24px) 40px;max-width:1360px;margin:0 auto}
.auth-l{display:grid;gap:14px;grid-template-rows:auto 1fr auto}
.auth-r{align-self:center}
.toast{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:999px;background:var(--wt);color:var(--wt-ink);width:max-content;max-width:100%;font-weight:600;font-size:14px}
.modal{background:var(--s1);border:1px solid var(--line);border-radius:30px;padding:26px;display:grid;gap:16px;box-shadow:var(--shadow)}
.warn{border:1px solid color-mix(in srgb,var(--bad) 50%,var(--line));background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:18px;padding:14px 16px;display:flex;gap:12px;font-size:14px}
.chart{display:flex;align-items:flex-end;gap:8px;height:200px;border-bottom:1px solid var(--line);padding-top:10px;position:relative}
.chart i{flex:1;background:var(--fg);border-radius:8px 8px 0 0;opacity:.9;min-width:0}.chart i.h{background:var(--acc)}
.chart::before{content:"limit $18/day";position:absolute;left:0;right:0;top:20px;border-top:1px dashed var(--mut);font:500 10px var(--f-m);color:var(--mut);text-transform:uppercase;letter-spacing:.1em;padding-top:4px}
.stepper{display:flex;gap:6px}.stepper i{flex:1;height:6px;border-radius:4px;background:var(--s3)}.stepper i.on{background:var(--fg)}.stepper i.cur{background:var(--acc)}
@media (max-width:1180px){.cols2,.split{grid-template-columns:1fr}.g12>*{grid-column:span 6}.g12>.sp12,.g12>.sp8{grid-column:span 12}.rs2{grid-row:auto}.cols3{grid-template-columns:1fr 1fr}}
@media (max-width:980px){.shell{grid-template-columns:1fr}.side{position:static;max-height:none}.idx{display:none}.auth{grid-template-columns:1fr}}
@media (max-width:700px){.g12>*{grid-column:span 12}.cols3,.form{grid-template-columns:1fr}.row{grid-template-columns:1fr!important;gap:8px}.hide-sm{display:none!important}.acts{justify-content:flex-start}.row.head{display:none}}
</style>

<div class="shell" id="shell"><aside class="side" id="side"></aside><main id="main"></main></div>
<div id="auth" hidden></div>
<script>
const I={

tasks:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2 2.1-2.2M3.5 12l1.2 1.2 2.1-2.2M3.5 18l1.2 1.2 2.1-2.2"/>',
board:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>',
agents:'<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V4.5M9 13v.5M15 13v.5M9.5 16.5h5"/>',
squads:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 14c2.8 0 5 1.6 5 4.5"/>',

logs:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m7 9 3 3-3 3M13 15h4"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/>',

play:'<path d="M7 5v14l12-7L7 5Z"/>',pause:'<path d="M8 5v14M16 5v14"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',arrow:'<path d="M7 17 17 7M8 7h9v9"/>',

git:'<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3.1-.3 6.4-1.5 6.4-7A5.4 5.4 0 0 0 20 4.8 5.1 5.1 0 0 0 19.9 1S18.7.7 16 2.5a13.4 13.4 0 0 0-7 0C6.3.7 5.1 1 5.1 1A5.1 5.1 0 0 0 5 4.8a5.4 5.4 0 0 0-1.5 3.8c0 5.4 3.3 6.600 6.400 7A3.400 3.400 0 0 0 9 18.100V22"/>'
};
const ico=n=>'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(I[n]||'')+'</svg>';
